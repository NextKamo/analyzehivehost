<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Website Brief Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&family=Manrope:wght@400;700&family=Nunito:wght@400;800&display=swap">
<style>
/* Layout: a workbook. One framed sheet per section (prompt on the left, answer boxes with a hard offset shadow on the right), a breadcrumb frame above, a pager frame below. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111827; --muted:#5E6577; --line:#E6E8EE; --soft:#FFF7DB;
  --accent:#F4B700; --accent-fg:#111827; --accent-text:#8A6400; --hl:#FFEBA8; --hl-fg:#111827; --shadow:rgba(28,34,48,.10); --warn:#B3411A;
  --f-display:"Plus Jakarta Sans","Trebuchet MS",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media not all{ :root:not([data-theme="light"]){
  --bg:#121620; --surface:#1B2130; --ink:#F3EEE2; --muted:#A3A9B8; --line:#343C50; --soft:#262D3F;
  --accent:#FFB52E; --accent-fg:#1C2230; --accent-text:#FFC85C; --hl:#D9A83C; --hl-fg:#1C2230; --shadow:rgba(0,0,0,.35); --warn:#F0A070; color-scheme:dark } }
:root[data-theme="off"]{
  --bg:#121620; --surface:#1B2130; --ink:#F3EEE2; --muted:#A3A9B8; --line:#343C50; --soft:#262D3F;
  --accent:#FFB52E; --accent-fg:#1C2230; --accent-text:#FFC85C; --hl:#D9A83C; --hl-fg:#1C2230; --shadow:rgba(0,0,0,.35); --warn:#F0A070; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.frame{border:1px solid var(--line);background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* breadcrumb frame */
.crumbs{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.crumb-text{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0}
.crumb-text b{color:var(--ink);font-weight:500}
.steps{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px}
.step{flex:none;width:30px;height:30px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:12px;padding:0}
.step.done{background:var(--soft)}
.step.on{background:var(--ink);color:var(--surface)}
.step.res{width:auto;padding:0 10px}

/* sheet */
.sheet{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.prompt{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.answers{padding:28px;display:flex;flex-direction:column;gap:26px;min-width:0}
@media (max-width:800px){ .sheet{grid-template-columns:minmax(0,1fr)} .prompt{border-right:0;border-bottom:1px solid var(--line);padding:20px} .answers{padding:20px} }
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:19px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.help h3{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-text);margin:0 0 2px}
.help p{margin:0;font-size:15px}
.help{display:flex;flex-direction:column;gap:12px}
.eg{font-size:14px;color:var(--muted);font-style:italic;margin:0}

/* fields */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.03em}
.label mark{background:var(--hl);color:var(--hl-fg);padding:1px 6px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 0}
.box{border:1px solid var(--line);background:var(--surface);box-shadow:5px 5px 0 var(--shadow);margin:0 5px 5px 0}
input[type=text],textarea{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 14px;display:block;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;font-size:14.5px;line-height:1.2;text-align:left}
.chip:hover{background:var(--soft)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cards .chip{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.cards .chip b{font-weight:600;font-size:15px}
.cards .chip span{font-size:13px;opacity:.8}
.addrow{display:flex;gap:8px;max-width:360px}
.addrow .box{flex:1;min-width:0;box-shadow:3px 3px 0 var(--shadow);margin:0 3px 3px 0}
.addrow input{padding:7px 10px;font-size:14.5px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.small{padding:7px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}

.tone{display:flex;flex-direction:column;gap:14px}
.tone-row{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px}
.tone-row span:last-child{text-align:right}
.tone-row input{width:100%;accent-color:var(--accent)}
@media (max-width:480px){ .tone-row{grid-template-columns:84px minmax(0,1fr) 84px;font-size:12px} }

.order{display:flex;flex-direction:column;gap:6px}
.order-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 6px 6px 12px;background:var(--surface)}
.order-row .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px}
.order-row .t{flex:1;min-width:0}
.order-row.fixed{background:var(--soft);padding:9px 12px}
.icon{width:30px;height:30px;border:1px solid var(--line);background:transparent;padding:0;font-size:14px;line-height:1}
.icon:hover{background:var(--soft)}
.icon:disabled{opacity:.3;cursor:default}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.swatch{border:1px solid var(--line);background:var(--surface);padding:0;text-align:left}
.swatch .bar{display:flex;height:38px}
.swatch .bar i{flex:1}
.swatch .bar i:first-child{flex:3}
.swatch .nm{display:block;padding:6px 10px;font-size:14px}
.swatch[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}
.pickers{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.pickers label{display:flex;align-items:center;gap:8px;font-size:14.5px}
input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);background:var(--surface)}

.refs{display:flex;flex-direction:column;gap:12px}
.ref{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}
@media (max-width:560px){ .ref{grid-template-columns:minmax(0,1fr)} }
.ready{display:flex;flex-direction:column;gap:8px}
.ready-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ready-row .t{flex:1 1 150px}

/* pager */
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.pager .count{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* intro */
.intro{padding:36px 28px;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:36px;align-items:start}
@media (max-width:800px){ .intro{grid-template-columns:minmax(0,1fr);padding:24px 20px;gap:24px} }
.intro-l{display:flex;flex-direction:column;gap:18px}
.intro-l p{margin:0;max-width:52ch}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.toc li{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--soft);align-items:baseline}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:22px}
.toc .d{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{padding:8px 16px;font-size:14px;background:var(--hl);color:var(--hl-fg);border:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto;background:transparent;border:1px solid currentColor;color:inherit;padding:3px 10px;font-size:13px}

/* results chrome */
.toolbar{padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .msg{font-size:14px;color:var(--muted);flex:1 1 200px;min-width:0}
.toolbar .msg.err{color:var(--warn)}
.docwrap{border:1px solid var(--line);background:var(--soft);padding:clamp(8px,2.5vw,28px)}

/* HiveHost skin */
.frame{border-radius:16px;border-color:var(--line);box-shadow:0 6px 24px var(--shadow)}
.box{border-radius:10px;box-shadow:0 2px 8px var(--shadow)!important;margin:0}
.addrow .box{margin:0}
.chip,.order-row,.swatch,.icon,.step{border-radius:10px;border-color:var(--line)}
.chip[aria-pressed=true],.step.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border-radius:999px;border-color:var(--line)}
.btn.primary{border-color:var(--accent);box-shadow:0 4px 12px rgba(244,183,0,.35)}
.prompt{border-right-color:var(--line)}
.docwrap{border-radius:16px}
.hh-brand{display:flex;align-items:center;gap:10px;padding:2px 4px 6px}
.hh-brand img{height:44px;width:auto;flex:none}
.hh-brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.hh-brand b i{font-style:normal;color:var(--accent-text)}
.hh-brand span{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
</style>

<style id="doc-css">
/* The brief itself. Fixed light "paper" so it reads the same on screen, in the downloaded file and in print. */
.doc{--d-paper:#FFFFFF;--d-ink:#111827;--d-muted:#5E6577;--d-line:#E6E8EE;--d-soft:#FAFAFB;--d-accent:#8A6400;--d-hl:#FFEBA8;
  background:var(--d-paper);color:var(--d-ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
  max-width:920px;margin:0 auto;padding:clamp(20px,5vw,56px);display:flex;flex-direction:column;gap:44px}
.doc *{box-sizing:border-box}
.doc h1,.doc h2,.doc h3,.doc p,.doc ul,.doc ol{margin:0}
.doc .mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--d-muted)}
.doc .cover{border-bottom:2px solid var(--d-ink);padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.doc .cover h1{font-family:"Plus Jakarta Sans","Trebuchet MS",sans-serif;font-weight:700;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.doc .cover .tag{font-size:20px;font-weight:600}
.doc .summary{font-size:18px;line-height:1.45;max-width:62ch}
.doc section{display:flex;flex-direction:column;gap:16px;min-width:0}
.doc h2{font-family:"Plus Jakarta Sans","Trebuchet MS",sans-serif;font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.01em}
.doc h3{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--d-accent)}
.doc .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.doc .kv{display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.doc .kv p{white-space:pre-line}
.doc .empty{color:var(--d-muted);font-style:italic}
.doc .tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0}
.doc .tags li{border-radius:999px;border:1px solid var(--d-ink);padding:3px 10px;font-size:14px}
.doc .tags li.hl{background:var(--d-hl)}
.doc ul.plain{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.doc .rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--d-ink)}
.doc .rings>div{padding:16px;border-right:1px dashed var(--d-ink);display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.doc .rings>div:last-child{border-right:0}
.doc .rings b{font-family:"Plus Jakarta Sans",sans-serif;font-size:22px}
@media (max-width:620px){ .doc .rings{grid-template-columns:minmax(0,1fr)} .doc .rings>div{border-right:0;border-bottom:1px dashed var(--d-ink)} .doc .rings>div:last-child{border-bottom:0} }

.doc .tree{display:flex;flex-direction:column;align-items:center;gap:0}
.doc .node{border:1px solid var(--d-ink);padding:6px 14px;font-weight:600;background:var(--d-paper)}
.doc .node.root{background:var(--d-ink);color:var(--d-paper)}
.doc .stem{width:1px;height:18px;background:var(--d-ink)}
.doc .kids{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;border-top:1px solid var(--d-ink);padding-top:14px}
.doc .kids .node{font-weight:500;font-size:14px}

.doc .frames{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.doc .frame-d{flex:1 1 420px;min-width:0;overflow-x:auto}
.doc .frame-p{flex:none}
.doc .cap{margin-bottom:6px}
.doc .mock{background:var(--m-bg);color:var(--m-ink);font-family:var(--m-body);border:1px solid var(--d-ink);border-radius:8px;overflow:hidden;font-size:13px;line-height:1.4;min-width:520px}
.doc .mock.phone{min-width:0;width:250px;border-radius:22px;border-width:5px;font-size:12px}
.doc .m-blk{position:relative;padding:26px 28px;border-top:1px dashed color-mix(in srgb,var(--m-ink) 22%,transparent)}
.doc .m-blk:first-child{border-top:0}
.doc .phone .m-blk{padding:18px 14px}
.doc .m-tag{position:absolute;top:4px;right:6px;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
.doc .m-nav{display:flex;align-items:center;gap:16px;padding:12px 28px}
.doc .phone .m-nav{padding:10px 14px}
.doc .m-logo{font-family:var(--m-head);font-weight:700;font-size:15px;margin-right:auto}
.doc .m-links{display:flex;gap:14px;font-size:12px;opacity:.8}
.doc .phone .m-links,.doc .phone .m-nav .m-btn{display:none}
.doc .m-burger{display:none;width:18px;height:12px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.doc .m-burger::after{content:"";position:absolute;left:0;right:0;top:3px;border-top:2px solid currentColor}
.doc .phone .m-burger{display:block}
.doc .m-h{font-family:var(--m-head);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.doc .m-h1{font-size:var(--m-h1,30px)}
.doc .phone .m-h1{font-size:21px}
.doc .m-h2{font-size:17px;margin-bottom:12px}
.doc .m-sub{opacity:.75;margin-top:8px;max-width:44ch}
.doc .m-bar{height:7px;border-radius:4px;background:color-mix(in srgb,var(--m-ink) 15%,transparent);margin-top:7px}
.doc .m-bar.s{width:60%}
.doc .m-btn{display:inline-block;background:var(--m-primary);color:var(--m-primary-fg);border-radius:var(--m-r);padding:7px 14px;font-weight:600;font-size:12px;white-space:nowrap}
.doc .m-btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.doc .m-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.doc .m-img{background:repeating-linear-gradient(135deg,var(--m-tint) 0 10px,color-mix(in srgb,var(--m-tint) 70%,var(--m-ink)) 10px 11px);border-radius:var(--m-rc);min-height:90px;display:flex;align-items:center;justify-content:center;font-family:"DM Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.doc .m-img span{background:var(--m-bg);padding:2px 6px;border-radius:3px}
.doc .m-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
.doc .m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.doc .phone .m-split,.doc .phone .m-grid{grid-template-columns:1fr}
.doc .phone .m-grid>*:nth-child(n+3){display:none}
.doc .m-card{background:var(--m-surface);border:1px solid color-mix(in srgb,var(--m-ink) 14%,transparent);border-radius:var(--m-rc);padding:12px}
.doc .m-card b{font-family:var(--m-head)}
.doc .m-center{text-align:center}
.doc .m-center .m-sub{margin-left:auto;margin-right:auto}
.doc .m-center .m-acts{justify-content:center}
.doc .m-band{background:var(--m-primary);color:var(--m-primary-fg)}
.doc .m-band .m-btn{background:var(--m-primary-fg);color:var(--m-primary)}
.doc .m-tinted{background:var(--m-tint)}
.doc .m-cover{background:linear-gradient(color-mix(in srgb,var(--m-ink) 55%,transparent),color-mix(in srgb,var(--m-ink) 55%,transparent)),repeating-linear-gradient(135deg,var(--m-tint) 0 10px,var(--m-primary) 10px 11px);color:#fff;padding-top:48px;padding-bottom:48px}
.doc .m-num{font-family:var(--m-head);font-weight:700;font-size:24px;color:var(--m-primary)}
.doc .m-dot{width:26px;height:26px;border-radius:50%;background:var(--m-primary);color:var(--m-primary-fg);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.doc .m-pill{height:22px;border-radius:var(--m-r);background:color-mix(in srgb,var(--m-ink) 12%,transparent);flex:1}
.doc .m-rowf{display:flex;gap:10px;align-items:center}
.doc .m-input{flex:1;height:30px;border:1.5px solid color-mix(in srgb,var(--m-ink) 35%,transparent);border-radius:var(--m-r);margin-top:8px}
.doc .m-acc{display:flex;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--m-ink) 20%,transparent);padding:8px 0}
.doc .m-foot{font-size:11px;opacity:.8;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.doc .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.doc .pg{border:1px solid var(--d-ink);display:flex;flex-direction:column}
.doc .pg b{padding:6px 10px;border-bottom:1px solid var(--d-ink);background:var(--d-soft);font-size:14px}
.doc .pg span{padding:7px 10px;border-bottom:1px dashed var(--d-line);font-size:13.5px}
.doc .pg span:last-child{border-bottom:0}

.doc .pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.doc .pal div{border:1px solid var(--d-line)}
.doc .pal i{display:block;height:64px}
.doc .pal span{display:block;padding:6px 8px;font-size:13px}
.doc .pal code{font-family:"DM Mono",monospace;font-size:12px;color:var(--d-muted);display:block}
.doc .type{border:1px solid var(--d-line);padding:18px;display:flex;flex-direction:column;gap:6px}
.doc .type .big{font-size:34px;line-height:1.05;font-weight:700}
.doc .tone-d{display:flex;flex-direction:column;gap:12px}
.doc .tr{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:10px;align-items:center;font-family:"DM Mono",monospace;font-size:12px}
.doc .tr span:last-child{text-align:right}
.doc .track{height:2px;background:var(--d-ink);position:relative}
.doc .track i{position:absolute;top:-7px;width:12px;height:16px;margin-left:-6px;background:var(--d-accent)}

/* ---------- state ---------- */
let S={step:0,a:defaults(),example:false};
function defaults(){return {pages:["about","services","contact"],home:["services","about","testimonials","cta"],tone:{},refs:[{u:"",n:""},{u:"",n:""},{u:"",n:""}],ready:{},c1:"#1B56C4",c2:"#F59E0B"}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.a){S=r;S.a=Object.assign(defaults(),S.a)}}catch(e){}}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=o=>Array.isArray(o)?o.map(v=>[v,v]):Object.entries(o).map(([k,v])=>[k,Array.isArray(v)?v[0]:v,Array.isArray(v)?v[1]:""]);
const filled=v=>v!=null&&(typeof v==="string"?v.trim()!=="":Array.isArray(v)?v.length>0:typeof v==="object"?Object.keys(v).length>0:true);
function sectionDone(s){return s.fields.some(f=>{const v=S.a[f.k];if(f.t==="refs")return (v||[]).some(r=>r.u.trim()||r.n.trim());if(f.t==="palette")return filled(v);return filled(v)})}
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||"");
function hex2hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("").toUpperCase()}
function lum(hex){const c=[1,3,5].map(i=>{const v=parseInt(hex.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function palette(a){
  let p,s;if(a.palette==="own"){p=hexOk(a.c1)?a.c1:"#1B56C4";s=hexOk(a.c2)?a.c2:"#F59E0B"}else{const P=PALETTES[a.palette]||PALETTES.blue;p=P[1];s=P[2]}
  const [h,sat]=hex2hsl(p),dark=a.mode==="dark";
  return {primary:p.toUpperCase(),accent:s.toUpperCase(),fg:lum(p)>.45?"#111111":"#FFFFFF",
    bg:dark?hsl2hex(h,Math.min(sat,22),9):hsl2hex(h,Math.min(sat,20),98),surface:dark?hsl2hex(h,Math.min(sat,18),14):"#FFFFFF",
    tint:dark?hsl2hex(h,Math.min(sat,28),20):hsl2hex(h,Math.min(sat,45),93),ink:dark?hsl2hex(h,Math.min(sat,15),93):hsl2hex(h,Math.min(sat,25),12)}
}

/* ---------- form rendering ---------- */
function field(f){
  const a=S.a,v=a[f.k],id="f-"+f.k;let h="";
  const lab=`<div class="label" id="${id}-l"><mark>${esc(f.l)}</mark></div>`;
  if(f.t==="text")h=`<div class="box"><input type="text" id="${id}" data-k="${f.k}" value="${esc(v||"")}" placeholder="${esc(f.ph||"")}" aria-labelledby="${id}-l"></div>`;
  else if(f.t==="area")h=`<div class="box"><textarea id="${id}" data-k="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||"")}" aria-labelledby="${id}-l">${esc(v||"")}</textarea></div>`;
  else if(f.t==="one")h=`<div class="chips" role="group" aria-labelledby="${id}-l">`+opts(f.o).map(([k,l])=>`<button type="button" class="chip" data-one="${f.k}" data-v="${esc(k)}" aria-pressed="${v===k}">${esc(l)}</button>`).join("")+`</div>`;
  else if(f.t==="cards")h=`<div class="cards" role="group" aria-labelledby="${id}-l">`+opts(f.o).map(([k,l,d])=>`<button type="button" class="chip" data-one="${f.k}" data-v="${esc(k)}" aria-pressed="${v===k}"><b>${esc(l)}</b><span>${esc(d)}</span></button>`).join("")+`</div>`;
  else if(f.t==="many"){
    const sel=v||[],base=opts(f.o),keys=base.map(o=>o[0]),extra=sel.filter(x=>!keys.includes(x)).map(x=>[x,x]);
    h=(f.max?`<p class="hint">Choose up to ${f.max}. ${sel.length} chosen.</p>`:"")+`<div class="chips" role="group" aria-labelledby="${id}-l">`+base.concat(extra).map(([k,l])=>`<button type="button" class="chip" data-many="${f.k}" data-v="${esc(k)}" data-max="${f.max||0}" aria-pressed="${sel.includes(k)}">${esc(l)}</button>`).join("")+`</div>`;
    if(f.custom)h+=`<div class="addrow"><div class="box"><input type="text" id="${id}-add" placeholder="${esc(f.custom)}" data-addinput="${f.k}" aria-label="${esc(f.custom)}"></div><button type="button" class="btn small" data-add="${f.k}" data-max="${f.max||0}">Add</button></div>`;
  }
  else if(f.t==="tone"){const t=v||{};h=`<div class="tone">`+TONE.map(([k,l,r])=>`<div class="tone-row"><span>${l}</span><input type="range" min="0" max="100" step="5" id="f-tone-${k}" data-tone="${k}" value="${t[k]==null?50:t[k]}" aria-label="${l} to ${r}"><span>${r}</span></div>`).join("")+`</div>`}
  else if(f.t==="order"){
    const sel=v||[];
    h=`<div class="order"><div class="order-row fixed"><span class="n">–</span><span class="t">Menu bar and opening (always first)</span></div>`+
      sel.map((k,i)=>`<div class="order-row"><span class="n">${i+1}</span><span class="t">${esc(HOME[k]||k)}</span><button type="button" class="icon" data-mv="-1" data-i="${i}" aria-label="Move ${esc(HOME[k])} up" ${i===0?"disabled":""}>↑</button><button type="button" class="icon" data-mv="1" data-i="${i}" aria-label="Move ${esc(HOME[k])} down" ${i===sel.length-1?"disabled":""}>↓</button><button type="button" class="icon" data-rm="${i}" aria-label="Remove ${esc(HOME[k])}">✕</button></div>`).join("")+
      `<div class="order-row fixed"><span class="n">–</span><span class="t">Footer (always last)</span></div></div>`;
    const rest=Object.keys(HOME).filter(k=>!sel.includes(k));
    if(rest.length)h+=`<p class="hint" style="margin-top:6px">Add a section:</p><div class="chips">`+rest.map(k=>`<button type="button" class="chip" data-addhome="${k}">+ ${esc(HOME[k])}</button>`).join("")+`</div>`;
  }
  else if(f.t==="palette"){
    h=`<div class="swatches" role="group" aria-labelledby="${id}-l">`+Object.entries(PALETTES).map(([k,[n,p,s]])=>`<button type="button" class="swatch" data-one="palette" data-v="${k}" aria-pressed="${v===k}"><span class="bar"><i style="background:${p}"></i><i style="background:${s}"></i></span><span class="nm">${n}</span></button>`).join("")+
      `<button type="button" class="swatch" data-one="palette" data-v="own" aria-pressed="${v==="own"}"><span class="bar"><i style="background:${esc(a.c1)}"></i><i style="background:${esc(a.c2)}"></i></span><span class="nm">Our own colours</span></button></div>`;
    if(v==="own")h+=`<div class="pickers"><label><input type="color" id="f-c1" data-color="c1" value="${esc(a.c1)}"> Main colour</label><label><input type="color" id="f-c2" data-color="c2" value="${esc(a.c2)}"> Second colour</label></div>`;
  }
  else if(f.t==="refs")h=`<div class="refs">`+(v||[]).map((r,i)=>`<div class="ref"><div class="box"><input type="text" id="f-ref-u${i}" data-ref="${i}" data-p="u" value="${esc(r.u)}" placeholder="Website address" aria-label="Website ${i+1} address"></div><div class="box"><input type="text" id="f-ref-n${i}" data-ref="${i}" data-p="n" value="${esc(r.n)}" placeholder="What do you like about it?" aria-label="What you like about website ${i+1}"></div></div>`).join("")+`</div>`;
  else if(f.t==="ready"){const r=v||{};h=`<div class="ready">`+READY.map(it=>`<div class="ready-row"><span class="t">${it}</span><button type="button" class="chip" data-ready="${it}" data-v="have" aria-pressed="${r[it]==="have"}">We have it</button><button type="button" class="chip" data-ready="${it}" data-v="need" aria-pressed="${r[it]==="need"}">We need it</button></div>`).join("")+`</div>`}
  return `<div class="field">${lab}${h}</div>`;
}

function crumbs(){
  const st=S.step;let text="Website brief";
  if(st>=1&&st<=N){const s=SECTIONS[st-1];text=`Website brief / ${esc(s.crumb)} / <b>${esc(s.title.replace(/[.?]$/,""))}</b>`}
  else if(st>N)text="Website brief / <b>Your document</b>";

function exampleBanner(){return S.example?`<div class="banner"><span>You are looking at example answers for a fictional brief. Replace them with your own, or clear them.</span><button type="button" data-act="reset-now">Clear example</button></div>`:""}

function viewIntro(){
  const started=SECTIONS.some(sectionDone)&&!S.example;
  return `<div class="frame intro"><div class="intro-l"><h1>Plan your website before anyone designs it.</h1>
   <p class="lead">Answer nine short sections about your business. You get a document that shows how the site should look and work.</p>
   <p>The document includes your pages, a sketch of the home page on computer and phone, colours, lettering and tone of voice. It takes about 15 minutes, and your answers are kept in this browser so you can stop and come back.</p>
   <div class="row"><button type="button" class="btn primary" data-go="1">${started?"Continue":"Start"}</button><button type="button" class="btn" data-act="example">See a filled-in example</button></div>
   ${started?`<p class="note">You have answers in progress on this device.</p>`:""}</div>
   <ol class="toc">${SECTIONS.map((s,i)=>`<li><span class="n">${i+1}</span><span>${esc(s.title.replace(/[.?]$/,""))}</span><span class="d">${esc(s.crumb)}</span></li>`).join("")}<li><span class="n">→</span><span><b>Your document</b></span><span class="d">Download</span></li></ol></div>`;
}
function viewSection(i){
  const s=SECTIONS[i];
  return `<div class="frame sheet"><div class="prompt"><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p><div class="help">${s.help.map(([h,p])=>`<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</div>${s.eg?`<p class="eg">${esc(s.eg)}</p>`:""}</div>
   <div class="answers">${s.fields.map(field).join("")}</div></div>
   <div class="frame pager"><button type="button" class="btn" data-go="${i}">Back</button><button type="button" class="btn primary" data-go="${i+2}">${i===N-1?"Create my document":"Next"}</button><span class="count">${i+1} / ${N}</span></div>`;
}
function viewResult(){
  return `<div class="frame toolbar">
    <button type="button" class="btn primary" data-act="pdf" ${dl?"":"hidden"}>Download PDF</button>
    <button type="button" class="btn" data-act="download" ${dl?"":"hidden"}>Download web page</button>
    <button type="button" class="btn" data-act="copy">Copy as text</button>
    <button type="button" class="btn" data-go="1">Edit answers</button>
    ${confirmReset?`<span class="row"><span class="note">Delete all answers?</span><button type="button" class="btn small" data-act="reset-now">Yes, start over</button><button type="button" class="btn small" data-act="reset-cancel">Keep them</button></span>`:`<button type="button" class="btn" data-act="reset">Start over</button>`}
    <span class="msg ${msgErr?"err":""}" role="status">${esc(msg)}</span>
   </div><div class="docwrap"><div class="doc">${buildDoc(S.a)}</div></div>`;
}
function render(keepScroll){
  const st=S.step,app=document.getElementById("app");
  app.innerHTML=hhBrand()+crumbs()+exampleBanner()+(st===0?viewIntro():st<=N?viewSection(st-1):viewResult());
  if(!keepScroll)window.scrollTo(0,0);
}

/* ---------- the document ---------- */
function val(v){return filled(v)?`<p>${esc(v)}</p>`:`<p class="empty">Not answered yet</p>`}
function kv(l,v){return `<div class="kv"><h3>${esc(l)}</h3>${val(v)}</div>`}
function toneWord(t,k,l,r){const x=t[k]==null?50:t[k];return x<35?l:x>65?r:null}

function mock(a,phone){

    contact:`<div class="m-split"><div><div class="m-h m-h2">Contact us</div><div class="m-input"></div><div class="m-input"></div><div class="m-input" style="height:50px"></div><div class="m-acts"><span class="m-btn">Send</span></div></div>${img("Map")}</div>`,
    cta:`<div class="m-h m-h2" style="margin-bottom:0">Ready when you are.</div><div class="m-acts"><span class="m-btn">${esc(cta)}</span></div>`};
  const cls={cta:"m-band m-center",stats:"m-tinted",logos:"m-tinted",newsletter:"m-tinted"};
  const blocks=(a.home||[]).map(k=>B[k]?`<div class="m-blk ${cls[k]||""}">${tag(esc(HOME[k]))}${B[k]}</div>`:"").join("");
  const style=`--m-primary:${P.primary};--m-primary-fg:${P.fg};--m-bg:${P.bg};--m-surface:${P.surface};--m-tint:${P.tint};--m-ink:${P.ink};--m-r:${r};--m-rc:${rc};--m-head:${T[2]};--m-body:${T[3]};--m-h1:${big}`;
  return `<div class="mock ${phone?"phone":""}" style="${style}"><div class="m-nav"><span class="m-logo">${esc(name)}</span><span class="m-links">${links}</span><span class="m-btn">${esc(cta)}</span><span class="m-burger"></span></div>${hero}${blocks}
   <div class="m-blk m-foot">${tag("Footer")}<b>${esc(name)}</b><span>${esc(a.area||"Address")}</span><span>Contact</span><span>Social links</span></div></div>`;
}

function openQuestions(a){
  const q=[];const need=(k,t)=>{if(!filled(a[k]))q.push(t)};
  need("name","Business name");need("oneLiner","A one-sentence description of the business");need("why","The purpose (why)");need("audiences","Who the main visitors are");need("needs","The top three things visitors come to do");
  need("mainGoal","The main goal of the website");need("cta","Words for the main button");need("values","Brand values");need("archetype","Brand archetype");need("palette","Colour direction");need("type","Lettering style");
  if(!(a.refs||[]).some(r=>r.u.trim()))q.push("Websites you like, for reference");need("launch","Target launch date");need("contact","Who approves the design");
  return q;
}
function summary(a){
  const name=a.name||"This business",n=(a.pages||[]).length+1,st=a.style?STYLE[a.style][0].toLowerCase()+" ":"";
  let s=`${name} needs a ${st}${n}-page website`;
  if(a.mainGoal)s+=` whose main job is to ${GOAL_VERB[a.mainGoal]}`;s+=".";
  if(a.device==="phone")s+=" Most visitors will arrive on a phone, so the phone layout comes first.";
  if(a.data==="yes")s+=" Pages must stay light for slow or costly connections.";
  if(filled(a.values))s+=` It should feel ${a.values.map(v=>v.toLowerCase()).join(", ")}.`;
  return s;
}
function buildDoc(a){
  const P=palette(a),T=TYPE[a.type]||TYPE.modern,t=a.tone||{},pages=a.pages||[],oq=openQuestions(a);
  const tags=(arr,hl)=>filled(arr)?`<ul class="tags">${arr.map(x=>`<li class="${hl?"hl":""}">${esc(x)}</li>`).join("")}</ul>`:`<p class="empty">Not answered yet</p>`;
  const sw=(n,h)=>`<div><i style="background:${h}"></i><span>${n}<code>${h}</code></span></div>`;
  const toneRows=TONE.map(([k,l,r,il,ir])=>{const x=t[k]==null?50:t[k];const imp=x<35?il:x>65?ir:`Balanced between ${l.toLowerCase()} and ${r.toLowerCase()}`;
    return `<div class="tr"><span>${l}</span><div class="track"><i style="left:${x}%"></i></div><span>${r}</span><div class="imp">${imp}.</div></div>`}).join("");
  const refs=(a.refs||[]).filter(r=>r.u.trim()||r.n.trim());
  const ready=a.ready||{};
  const notes=[];
  if(a.device==="phone")notes.push("Design the phone layout first; the computer layout follows from it.");
  if(a.data==="yes")notes.push("Keep pages light: compressed images, no autoplay video, text readable before pictures load.");
  if(a.hero==="video"&&a.data==="yes")notes.push("The opening video conflicts with the light-pages requirement. Use a still picture on phones.");
  if(pages.length>6)notes.push(`The menu has ${pages.length+1} items. Group some under a “More” item or the footer.`);
  if((a.features||[]).includes("More than one language"))notes.push("Add a language switch to the menu bar and allow for longer text in buttons.");
  if((a.features||[]).includes("WhatsApp chat button"))notes.push("Place the WhatsApp button fixed at the bottom-right corner on every page.");
  if(a.cta)notes.push(`The “${a.cta}” button appears in the menu bar, the opening and the closing band.`);
  return `
  <div class="cover"><div class="mono">Website UI brief · ${today()}${S.example?" · Example":""}</div><h1>${esc(a.name||"Untitled business")}</h1>${a.tagline?`<div class="tag">${esc(a.tagline)}</div>`:""}
   <p class="summary">${esc(summary(a))}</p></div>

  <section><h2>The business</h2><div class="cols">${kv("What it does",a.oneLiner)}${kv("Industry",a.industry)}${kv("Operates in",a.area)}</div>
   ${filled(a.currentSite)||filled(a.siteProblem)?`<div class="cols">${kv("Current website",a.currentSite)}${kv("What is not working",a.siteProblem)}</div>`:""}
   <div class="rings"><div><h3>Why · purpose</h3>${val(a.why)}</div><div><h3>How · process</h3>${val(a.how)}</div><div><h3>What · result</h3>${val(a.what)}</div></div></section>

  <section><h2>Visitors and goals</h2><div class="cols">${kv("Main visitors",a.audiences)}${kv("They come to",a.needs)}</div>
   <div class="cols">${kv("Main goal",a.mainGoal?GOALS[a.mainGoal]:"")}${kv("Main button",a.cta)}${kv("Devices",a.device?DEVICE[a.device]:"")}</div>
   <div class="cols">${kv("Other goals",(a.otherGoals||[]).map(g=>GOALS[g]).join("\n"))}${kv("Success looks like",a.success)}</div></section>

  <section><h2>Site map</h2><div class="tree"><div class="node root">Home</div>${pages.length?`<div class="stem"></div><div class="kids">${pages.map(k=>`<div class="node">${esc(pageName(k))}</div>`).join("")}</div>`:""}</div>
   <p class="mono">${pages.length+1} pages · menu order as shown</p></section>

  <section><h2>Home page layout</h2><p>A wireframe, not a finished design. It shows what goes where and in what order, drawn in the chosen colours, lettering and shapes. Striped boxes stand for pictures and grey bars for text.</p>
   <div class="frames"><div class="frame-d"><div class="mono cap">Computer</div>${mock(a,false)}</div><div class="frame-p"><div class="mono cap">Phone</div>${mock(a,true)}</div></div>
   ${notes.length?`<div><h3>Layout notes</h3><ul class="plain" style="margin-top:8px">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}</section>

  ${pages.length?`<section><h2>Other pages</h2><p>Suggested sections for each page, top to bottom.</p><div class="pages">${pages.map(k=>`<div class="pg"><b>${esc(pageName(k))}</b>${(PAGE_PLAN[k]||PAGE_PLAN._custom).map(x=>`<span>${x}</span>`).join("")}</div>`).join("")}</div></section>`:""}

  <section><h2>Visual direction</h2><div class="pal">${sw("Main",P.primary)}${sw("Accent",P.accent)}${sw("Text",P.ink)}${sw("Tint",P.tint)}${sw("Background",P.bg)}</div>
   ${filled(a.palette)?"":`<p class="empty">No colour chosen yet. A placeholder palette is shown.</p>`}
   <div class="type"><h3>Lettering · ${a.type?esc(T[0]):"not chosen yet"}</h3><div class="big" style="font-family:${T[2]}">${esc(a.name||"Your business")}</div><div style="font-family:${T[3]}">${esc(a.oneLiner||"Body text is set in a clear, readable face at a comfortable size.")}</div><div class="mono">Suggested fonts: ${T[4]}</div></div>
   <div class="cols">${kv("Overall style",a.style?STYLE[a.style].join(". "):"")}${kv("Shapes",a.corners?CORNERS[a.corners].join(". "):"")}${kv("Page background",a.mode?MODE[a.mode].join(". "):"")}</div>
   <div class="kv"><h3>Pictures</h3>${tags(a.imagery)}</div>
   ${refs.length?`<div class="kv"><h3>Reference websites</h3><table><tr><th>Website</th><th>What they like</th></tr>${refs.map(r=>`<tr><td>${esc(r.u)}</td><td>${esc(r.n)}</td></tr>`).join("")}</table></div>`:""}</section>

  <section><h2>Voice and character</h2><div class="cols"><div class="kv"><h3>Values</h3>${tags(a.values,true)}</div>${kv("Archetype",a.archetype?ARCH[a.archetype].join(" — "):"")}</div>
   <div class="tone-d">${toneRows}</div><div class="cols">${kv("Visitors should feel",a.feel)}${kv("Avoid",a.avoid)}</div></section>

  <section><h2>Features and content</h2><div class="kv"><h3>Features</h3>${tags(a.features)}</div>
   <table><tr><th>Content</th><th>Status</th></tr>${READY.map(it=>`<tr><td>${it}</td><td>${ready[it]==="have"?`<span class="yes">Ready</span>`:ready[it]==="need"?`<span class="no">To be produced</span>`:`<span class="empty">Not answered</span>`}</td></tr>`).join("")}</table>
   <div class="cols">${kv("Languages",a.languages)}${kv("Go-live",a.launch)}${kv("Design approval",a.contact)}</div></section>

  ${oq.length?`<section class="open"><h2>Still to confirm</h2><ul class="plain">${oq.map(q=>`<li>${q}</li>`).join("")}</ul></section>`:""}
  <div class="foot mono"><span>${esc(a.name||"Website")} · UI brief</span><span>${today()}</span></div>`;
}

function buildText(a){
  const P=palette(a),L=[],T=TYPE[a.type]||TYPE.modern,t=a.tone||{};
  const add=(l,v)=>{L.push(l+": "+(filled(v)?String(v).replace(/\n/g,"; "):"—"))};
  L.push("WEBSITE UI BRIEF — "+(a.name||"Untitled business"),today(),"",summary(a),"","THE BUSINESS");
  add("What it does",a.oneLiner);add("Industry",a.industry);add("Operates in",a.area);add("Why",a.why);add("How",a.how);add("What",a.what);add("Tagline",a.tagline);
  L.push("","VISITORS AND GOALS");add("Main visitors",a.audiences);add("They come to",a.needs);add("Main goal",a.mainGoal&&GOALS[a.mainGoal]);add("Main button",a.cta);add("Devices",a.device&&DEVICE[a.device]);add("Success",a.success);
  L.push("","SITE MAP","Home"+(a.pages||[]).map(k=>"\n  - "+pageName(k)).join(""));
  L.push("","HOME PAGE, TOP TO BOTTOM","1. Menu bar","2. Opening ("+(HERO[a.hero||"split"][0])+")");(a.home||[]).forEach((k,i)=>L.push((i+3)+". "+HOME[k]));L.push(((a.home||[]).length+3)+". Footer");
  L.push("","VISUAL DIRECTION","Main "+P.primary+" · Accent "+P.accent+" · Text "+P.ink+" · Tint "+P.tint+" · Background "+P.bg);add("Lettering",a.type&&T[0]+" ("+T[4]+")");add("Style",a.style&&STYLE[a.style][0]);add("Shapes",a.corners&&CORNERS[a.corners][0]);add("Pictures",(a.imagery||[]).join(", "));
  L.push("","VOICE");add("Values",(a.values||[]).join(", "));add("Archetype",a.archetype&&ARCH[a.archetype][0]);
  TONE.forEach(([k,l,r])=>{const x=t[k]==null?50:t[k];L.push(l+" "+(100-x)+" / "+x+" "+r)});add("Feel",a.feel);add("Avoid",a.avoid);
  L.push("","FEATURES AND CONTENT");add("Features",(a.features||[]).join(", "));READY.forEach(it=>add(it,(a.ready||{})[it]==="have"?"Ready":(a.ready||{})[it]==="need"?"To be produced":""));add("Languages",a.languages);add("Go-live",a.launch);add("Approval",a.contact);
  const oq=openQuestions(a);if(oq.length)L.push("","STILL TO CONFIRM",...oq.map(q=>"- "+q));
  return L.join("\n");
}
function exportHtml(){
  const title=(S.a.name||"Website")+" – Website UI brief";
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><link rel="stylesheet" href="${FONT_HREF}"><style>body{margin:0;background:#FFFFFF}@media print{body{background:#fff}}${document.getElementById("doc-css").textContent}</style></head><body><div class="doc">${buildDoc(S.a)}</div></body></html>`;
}

/* ---------- events ---------- */
function touch(){if(S.example){/* edits keep the banner until cleared */}save()}
const app=document.getElementById("app");
app.addEventListener("input",e=>{
  const el=e.target,d=el.dataset;
  if(d.k){S.a[d.k]=el.value}
  else if(d.tone){S.a.tone=S.a.tone||{};S.a.tone[d.tone]=+el.value}
  else if(d.ref){S.a.refs[+d.ref][d.p]=el.value}
  else if(d.color){S.a[d.color]=el.value}
  else return;
  touch();
});
app.addEventListener("change",e=>{if(e.target.dataset.color||e.target.dataset.k&&e.target.dataset.k==="name")render(true)});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.addinput){e.preventDefault();addCustom(e.target.dataset.addinput)}});
function addCustom(k){
  const inp=document.getElementById("f-"+k+"-add"),v=(inp.value||"").trim();if(!v)return;
  const f=SECTIONS.flatMap(s=>s.fields).find(x=>x.k===k),arr=S.a[k]=S.a[k]||[];
  if(f.max&&arr.length>=f.max)return;
  if(!arr.includes(v))arr.push(v);touch();render(true);
}
app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset,a=S.a;
  if(d.go!=null){S.step=Math.max(0,Math.min(N+1,+d.go));msg="";confirmReset=false;save();render();return}
  if(d.one){a[d.one]=a[d.one]===d.v?"":d.v}
  else if(d.many){const arr=a[d.many]=a[d.many]||[],i=arr.indexOf(d.v);if(i>=0)arr.splice(i,1);else if(!+d.max||arr.length<+d.max)arr.push(d.v)}
  else if(d.add){addCustom(d.add);return}
  else if(d.mv){const i=+d.i,j=i+ +d.mv,h=a.home;[h[i],h[j]]=[h[j],h[i]]}
  else if(d.rm!=null){a.home.splice(+d.rm,1)}
  else if(d.addhome){(a.home=a.home||[]).push(d.addhome)}
  else if(d.ready){a.ready=a.ready||{};a.ready[d.ready]=a.ready[d.ready]===d.v?undefined:d.v;if(!a.ready[d.ready])delete a.ready[d.ready]}
  else if(d.act==="example"){S={step:N+1,a:Object.assign(defaults(),JSON.parse(JSON.stringify(EXAMPLE))),example:true};save();render();return}
  else if(d.act==="reset"){confirmReset=true}
  else if(d.act==="reset-cancel"){confirmReset=false}
  else if(d.act==="reset-now"){S={step:0,a:defaults(),example:false};confirmReset=false;msg="";save();render();return}
  else if(d.act==="copy"){
    const text=buildText(a);
    try{await navigator.clipboard.writeText(text);msg="Copied. Paste it into an email or document.";msgErr=false}
    catch(err){msg="Copying is blocked in this view. Use Download instead.";msgErr=true}
  }
  else if(d.act==="pdf"){
    if(!dl)return;
    const el=document.querySelector(".doc");
    if(!el||!window.html2canvas||!window.jspdf){msg="The PDF tools did not load. Check your connection and try again.";msgErr=true;touch();render(true);return}
    b.disabled=true;msg="Building PDF…";msgErr=false;
    try{
      const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
      const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=28;
      const cw=PW-2*M,ch=PH-2*M,k=cw/cv.width,sliceH=Math.floor(ch/k);
      for(let y=0,pg=0;y<cv.height;y+=sliceH,pg++){
        const h=Math.min(sliceH,cv.height-y),c=document.createElement("canvas");
        c.width=cv.width;c.height=h;
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
        if(pg)pdf.addPage();
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",M,M,cw,h*k);
      }
      const fn=((a.name||"website").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-")||"website")+"-ui-brief.pdf";
      await dl.save({filename:fn,data:pdf.output("arraybuffer")});msg="Saved "+fn+".";msgErr=false;
    }catch(err){const c=err&&err.code;if(c==="declined"){msg="";msgErr=false}else if(c==="rate_limited"){msg="A download prompt is already open. Try again in a moment.";msgErr=true}else{msg="The PDF could not be saved in this view. Copy the text instead.";msgErr=true}}
  }
  else if(d.act==="download"){
    if(!dl)return;
    const fn=((a.name||"website").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-")||"website")+"-ui-brief.html";
    try{await dl.save({filename:fn,data:exportHtml()});msg="Saved "+fn+".";msgErr=false}
    catch(err){const c=err&&err.code;if(c==="declined"){msg="Download cancelled.";msgErr=false}else if(c==="rate_limited"){msg="A download prompt is already open. Try again in a moment.";msgErr=true}else{msg="The file could not be saved in this view. Copy the text instead.";msgErr=true}}
  }
  else return;
  touch();render(true);
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.a){S=data;S.a=Object.assign(defaults(),S.a)}else load();
  render();
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(n=>{dl=n||null;if(S.step>N)render(true)}).catch(()=>{});
  }
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S)}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||null);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
